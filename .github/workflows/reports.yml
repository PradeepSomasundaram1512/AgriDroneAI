name: Reports
on:
  schedule:
    - cron: "0 8 * * 1"    # weekly, Monday
    - cron: "0 8 1 * *"    # monthly summary
  workflow_dispatch:
permissions: {contents: write, issues: write}
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - name: Build report
        run: |
          KIND=weekly
          [ "$(date -u +%d)" = "01" ] && KIND=monthly
          echo "KIND=$KIND" >> $GITHUB_ENV
          PYTHONPATH=. python -m agridrone.cli report $KIND --write | tee out.txt
          echo "FILE=$(tail -1 out.txt)" >> $GITHUB_ENV
      - name: Commit and publish as issue
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name "agridrone-autopilot"; git config user.email "autopilot@users.noreply.github.com"
          git add reports && git commit -m "report: $KIND $(date -u +%F)" && git push || true
          gh issue create --title "$KIND report $(date -u +%F)" --label report --body-file "$FILE" || true
