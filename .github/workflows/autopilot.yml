# The system's heartbeat: one operating cycle (= one simulated day) per run, state committed to git
# so every decision is auditable and recoverable via `git revert`.
name: Autopilot
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
concurrency: {group: autopilot, cancel-in-progress: false}
permissions: {contents: write, issues: write}
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Run tests first (never operate on a broken build)
        run: pip install pytest && PYTHONPATH=. pytest -q
      - name: Operating cycle
        id: cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; advisor is off without it
        run: |
          pip install anthropic || true
          PYTHONPATH=. python -m agridrone.cli cycle -n 1
      - name: Commit state + audit log
        if: always()
        run: |
          git config user.name "agridrone-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add state && (git diff --cached --quiet || git commit -m "autopilot: cycle $(date -u +%F)")
          git push || (git pull --rebase && git push)
      - name: Open incident issue on failure
        if: failure()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh issue create --title "Autopilot incident $(date -u +%F)" --label incident --body "Cycle failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Runbook: docs/GOVERNANCE.md#incident-response" || true
