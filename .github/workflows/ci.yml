name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install pytest
      - run: PYTHONPATH=. pytest -q
      - name: Smoke-run 10 autonomous cycles on a scratch state dir
        run: |
          PYTHONPATH=. python - <<'PY'
          import tempfile
          from agridrone.agent import run_cycle
          from agridrone.config import load_policy
          p = load_policy(); d = tempfile.mkdtemp()
          assert all(run_cycle(p, d)["ok"] for _ in range(10))
          PY
