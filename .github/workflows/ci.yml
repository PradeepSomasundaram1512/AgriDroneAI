name: CI
on:
  push:
  pull_request:
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
env: {AGRIDRONE_OFFLINE: "1", PYTHONPATH: "."}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip}
      - run: pip install ruff
      - run: ruff check agridrone tests scripts
      - run: ruff format --check agridrone tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {python: ["3.11", "3.12", "3.13"]}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install pytest pytest-cov numpy rasterio
      - name: Tests with coverage gate (fails under 85%)
        run: pytest -q --cov --cov-report=term-missing
      - name: Policy validates and shipped state is healthy
        run: python -c "from agridrone.config import load_policy; load_policy()" && python -m agridrone.cli verify && python -m agridrone.cli docs-sync --check
      - name: Smoke-run 10 autonomous cycles on a scratch state dir
        run: |
          python - <<'PY'
          import tempfile
          from agridrone.agent import run_cycle
          from agridrone.config import load_policy
          p = load_policy(); d = tempfile.mkdtemp()
          assert all(run_cycle(p, d)["ok"] for _ in range(10))
          PY

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip}
      - run: python -m pip install --upgrade pip && pip install bandit pip-audit
      - name: Static security scan (medium+ severity fails the build)
        run: bandit -q -r agridrone -ll
      - name: Dependency audit (runtime + optional extras)
        run: |
          pip install ".[llm,hardware,imagery]"
          pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image and run a cycle inside it
        run: |
          docker build -t agridrone:ci .
          docker run --rm -e AGRIDRONE_OFFLINE=1 agridrone:ci verify
